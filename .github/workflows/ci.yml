name: CI

on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'doc-site/**'
  push:
    branches: [dev, main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'doc-site/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint test
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: ScreenView/CardMenu regression test
        run: npm test -- --ci --watchAll=false